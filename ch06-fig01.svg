<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="ch06-fig01-title ch06-fig01-desc"><title id="ch06-fig01-title">剛體平移的位置向量與參考座標</title><desc id="ch06-fig01-desc">剛體平移的位置向量與參考座標。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch06-fig01-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch06-fig01-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch06-fig01-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch06-fig01-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch06-fig01-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch06-fig01-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch06-fig01-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch06-fig01-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><line x1="88" y1="337" x2="528" y2="337" class="geo" marker-end="url(#ch06-fig01-geo)"/><line x1="88" y1="337" x2="88" y2="77" class="geo" marker-end="url(#ch06-fig01-geo)"/><text x="536" y="344" class="" text-anchor="start">x</text><text x="78" y="65" class="" text-anchor="start">y</text><g transform="translate(367 179) rotate(23)"><ellipse cx="0" cy="0" rx="68" ry="95" class="body"/></g><circle cx="356" cy="238" r="4" class="dot"/><text x="330" y="253" class="" text-anchor="start">A</text><circle cx="374" cy="128" r="4" class="dot"/><text x="384" y="116" class="" text-anchor="start">B</text><line x1="88" y1="337" x2="356" y2="238" class="velocity" marker-end="url(#ch06-fig01-velocity)"/><line x1="88" y1="337" x2="374" y2="128" class="motion" marker-end="url(#ch06-fig01-motion)"/><line x1="356" y1="238" x2="374" y2="128" class="force" marker-end="url(#ch06-fig01-force)"/><text x="179" y="308" class="velocity-label" text-anchor="start">rA</text><text x="168" y="230" class="motion-label" text-anchor="start">rB</text><text x="396" y="203" class="force-label" text-anchor="start">rB/A</text><text x="46" y="363" class="" text-anchor="start">O</text><text x="40" y="32" class="small" text-anchor="start">固定座標</text><text x="458" y="114" class="small" text-anchor="start">平移座標</text><text x="320.0" y="419" class="eq" text-anchor="middle">rB = rA + rB/A　　平移時：vA = vB</text></svg>
