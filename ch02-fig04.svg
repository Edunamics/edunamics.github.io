<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="ch02-fig04-title ch02-fig04-desc"><title id="ch02-fig04-title">切線加速度、法線加速度與合加速度</title><desc id="ch02-fig04-desc">切線加速度、法線加速度與合加速度。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch02-fig04-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig04-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig04-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig04-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig04-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig04-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig04-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch02-fig04-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><circle cx="285" cy="205" r="108" class="geo"/><circle cx="285" cy="205" r="4" class="dot"/><text x="260" y="232" class="" text-anchor="start">O</text><circle cx="370" cy="138" r="4" class="dot"/><text x="380" y="126" class="" text-anchor="start">P</text><line x1="370" y1="138" x2="435" y2="221" class="velocity" marker-end="url(#ch02-fig04-velocity)"/><line x1="370" y1="138" x2="288" y2="203" class="motion" marker-end="url(#ch02-fig04-motion)"/><line x1="370" y1="138" x2="353" y2="285" class="force" marker-end="url(#ch02-fig04-force)"/><line x1="288" y1="203" x2="353" y2="285" class="guide"/><line x1="435" y1="221" x2="353" y2="285" class="guide"/><text x="445" y="213" class="velocity-label" text-anchor="start">aₜ</text><text x="290" y="167" class="motion-label" text-anchor="start">aₙ</text><text x="368" y="281" class="force-label" text-anchor="start">a</text><text x="60" y="77" class="velocity-label" text-anchor="start">aₜ：改變速率</text><text x="60" y="108" class="motion-label" text-anchor="start">aₙ：改變方向</text><text x="320.0" y="375" class="eq" text-anchor="middle">aₙ = v²/r　　aₜ = rα　　a² = aₙ² + aₜ²</text></svg>
