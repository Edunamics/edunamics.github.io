<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edunamics 知識動力場</title>
<style>
  @font-face {
    font-family:"HanWangHeiHeavy";
    src:url("fonts/HanWangHeiHeavy-subset.woff2") format("woff2");
    font-weight:normal; font-style:normal; font-display:swap;
  }
  :root { --bg:#0b2a4a; --line:rgba(255,255,255,.08); --fg:#e8f1fb; --accent:#4fb3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--fg); font-family:"HanWangHeiHeavy","PingFang TC","Microsoft JhengHei",sans-serif; font-weight:normal; padding:16px; text-align:center;
  }
  .card { border:1px solid var(--accent); padding:40px 24px 32px; max-width:560px; width:100%; background:rgba(11,42,74,.85); }
  h1 { font-size:2.4rem; letter-spacing:.05em; font-weight:normal; }
  h1 span { color:var(--accent); }
  .zh { font-size:1.3rem; margin-top:6px; opacity:.9; }

  /* iOS 風格 App 圖示 */
  .apps { margin-top:32px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px 12px; justify-items:center; }
  .app { display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none; color:var(--fg); }
  .icon {
    width:72px; height:72px; border-radius:22.5%;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s ease;
  }
  .icon::after { /* 頂部高光 */
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%);
  }
  .icon svg { width:62%; height:62%; position:relative; z-index:1; }
  .app:hover .icon, .app:active .icon { transform:scale(.92); }
  .label { font-size:.82rem; letter-spacing:.02em; }

  .mfg  { background:linear-gradient(160deg,#ffb347 0%,#ff7a18 100%); }
  .stat { background:linear-gradient(160deg,#5ac8fa 0%,#0a64d6 100%); }
  .dyn  { background:linear-gradient(160deg,#5ef08c 0%,#18a957 100%); }
  .mat  { background:linear-gradient(160deg,#c48bff 0%,#6e3bd6 100%); }

  .status { margin-top:30px; font-size:.85rem; color:var(--accent); }
  @media (max-width:380px){ .icon{width:60px;height:60px;} .label{font-size:.75rem;} }
</style>
</head>
<body>
  <div class="card">
    <h1>Edu<span>namics</span></h1>
    <div class="zh">知識動力場</div>

    <div class="apps">
      <!-- 機械製造：齒輪 -->
      <a class="app" href="#manufacturing">
        <div class="icon mfg">
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round">
            <path d="M52.3 26.5 L58.6 27.4 L58.6 36.6 L52.3 37.5 L50.2 42.4 L54.1 47.5 L47.5 54.1 L42.4 50.2 L37.5 52.3 L36.6 58.6 L27.4 58.6 L26.5 52.3 L21.6 50.2 L16.5 54.1 L9.9 47.5 L13.8 42.4 L11.7 37.5 L5.4 36.6 L5.4 27.4 L11.7 26.5 L13.8 21.6 L9.9 16.5 L16.5 9.9 L21.6 13.8 L26.5 11.7 L27.4 5.4 L36.6 5.4 L37.5 11.7 L42.4 13.8 L47.5 9.9 L54.1 16.5 L50.2 21.6Z"/>
            <circle cx="32" cy="32" r="8"/>
          </svg>
        </div>
        <span class="label">機械製造</span>
      </a>

      <!-- 靜力學：桁架＋支承＋外力 -->
      <a class="app" href="#statics">
        <div class="icon stat">
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M8 46h48L44 26H20z"/>
            <path d="M20 26l12 20 12-20M32 46V26"/>
            <path d="M8 46l-4 8h8zM56 46l-4 8h8z"/>
            <path d="M32 4v14M27 13l5 6 5-6"/>
          </svg>
        </div>
        <span class="label">靜力學</span>
      </a>

      <!-- 動力學：拋物軌跡＋速度向量 -->
      <a class="app" href="#dynamics">
        <div class="icon dyn">
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 54C14 18 34 10 50 30" stroke-dasharray="1 7"/>
            <circle cx="50" cy="32" r="7" fill="#fff" stroke="none"/>
            <path d="M50 32l10 12M60 44l-1-7M60 44l-7-1"/>
            <path d="M4 58h56"/>
          </svg>
        </div>
        <span class="label">動力學</span>
      </a>

      <!-- 材料力學：應力-應變曲線 -->
      <a class="app" href="#mechanics-of-materials">
        <div class="icon mat">
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v50h50"/>
            <path d="M8 56L20 22c2-4 4-4 6-2 3 3 6 2 9-1 6-5 12-3 16 4l3 7"/>
            <circle cx="54" cy="30" r="2.5" fill="#fff"/>
          </svg>
        </div>
        <span class="label">材料力學</span>
      </a>
    </div>

    <p class="status">✔ 網站架設測試成功 — 建置中，敬請期待</p>
  </div>
</body>
</html>
