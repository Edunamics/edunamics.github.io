<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edunamics 知識動力場</title>
<style>
  :root { --bg:#0b2a4a; --line:rgba(255,255,255,.08); --fg:#e8f1fb; --accent:#4fb3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--fg); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:16px; text-align:center;
  }
  .card { border:1px solid var(--accent); padding:40px 28px; max-width:520px; width:100%; background:rgba(11,42,74,.85); }
  h1 { font-size:2.2rem; letter-spacing:.05em; }
  h1 span { color:var(--accent); }
  .zh { font-size:1.3rem; margin-top:6px; opacity:.9; }
  .subjects { margin-top:22px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .subjects div { border:1px solid var(--line); padding:6px 12px; font-size:.95rem; }
  .status { margin-top:26px; font-size:.85rem; color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Edu<span>namics</span></h1>
    <div class="zh">知識動力場</div>
    <div class="subjects">
      <div>機械製造</div><div>靜力學</div><div>動力學</div><div>材料力學</div>
    </div>
    <p class="status">✔ 網站架設測試成功 — 建置中，敬請期待</p>
  </div>
</body>
</html>
