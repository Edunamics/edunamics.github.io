<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edunamics 知識動力場</title>
<style>
  @font-face {
    font-family:"HanWangHeiHeavy";
    src:url("fonts/HanWangHeiHeavy-subset.woff2") format("woff2");
    font-weight:normal; font-style:normal; font-display:swap;
  }
  :root { --bg:#0b2a4a; --line:rgba(255,255,255,.08); --fg:#e8f1fb; --accent:#4fb3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--fg); font-family:"HanWangHeiHeavy","PingFang TC","Microsoft JhengHei",sans-serif; font-weight:normal; padding:16px; text-align:center;
  }
  .card { border:1px solid var(--accent); padding:40px 24px 32px; max-width:560px; width:100%; background:rgba(11,42,74,.85); }
  h1 { font-size:2.4rem; letter-spacing:.05em; font-weight:normal; }
  h1 { line-height:1.3; white-space:nowrap; }
  h1 .tail { color:var(--accent); }
  /* Edu ⇄ Dy 切換窗：裁切範圍外的字 */
  .swap { display:inline-block; position:relative; overflow:hidden; height:1.3em; padding-top:.45em; margin-top:-.45em; vertical-align:top; box-sizing:content-box; }
  .swap .w { position:absolute; right:.05em; top:.45em; line-height:1.3em; will-change:transform; }
  .zh { font-size:1.3rem; margin-top:6px; opacity:.9; }

  /* iOS 風格 App 圖示 */
  .apps { margin-top:32px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px 12px; justify-items:center; }
  .app { display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none; color:var(--fg); }
  .icon {
    width:72px; height:72px; border-radius:22.5%;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s ease;
  }
  .icon::after { /* 頂部高光 */
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%);
  }
  .icon svg { width:62%; height:62%; position:relative; z-index:1; }
  .app:hover .icon, .app:active .icon { transform:scale(.92); }
  .label { font-size:.82rem; letter-spacing:.02em; }

  .mfg  { background:linear-gradient(160deg,#ffb347 0%,#ff7a18 100%); }
  .stat { background:linear-gradient(160deg,#5ac8fa 0%,#0a64d6 100%); }
  .dyn  { background:linear-gradient(160deg,#5ef08c 0%,#18a957 100%); }
  .mat  { background:linear-gradient(160deg,#c48bff 0%,#6e3bd6 100%); }

  /* 左下角：白筆四分之一齒輪（圓心在角落） */
  .corner-gear {
    position:fixed; left:0; bottom:0; width:min(70vmin,520px); height:min(70vmin,520px);
    transform:translate(-50%,50%); pointer-events:none; z-index:0; opacity:.55;
  }
  .corner-gear g { transform-origin:0 0; animation:gear-spin 120s linear infinite; }
  @keyframes gear-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .corner-gear g { animation:none; } }
  .card { position:relative; z-index:1; }
  /* 圖示內部小動畫 */
  .ic-gear  { transform-origin:32px 32px; animation:gear-spin 8s linear infinite; }
  .ic-force { animation:press 2.6s ease-in-out infinite; }
  @keyframes press { /* 施力壓下後阻尼回彈 */
    0%,100%{transform:translateY(-3px)} 30%{transform:translateY(3px)} 42%{transform:translateY(-1px)}
    52%{transform:translateY(1.6px)} 62%{transform:translateY(.4px)} 72%{transform:translateY(1px)} }
  .ic-curve { stroke-dasharray:100; animation:draw 4s ease-in-out infinite; }
  @keyframes draw { 0%{stroke-dashoffset:100;opacity:1} 55%{stroke-dashoffset:0} 88%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  .ic-break { opacity:0; animation:pop 4s ease-in-out infinite; }
  @keyframes pop { 0%,52%{opacity:0} 58%,88%{opacity:1} 100%{opacity:0} }
  @media (prefers-reduced-motion: reduce){ .ic-gear,.ic-force,.ic-curve,.ic-break{animation:none;opacity:1} }
  .status { margin-top:30px; font-size:.85rem; color:var(--accent); }
  @media (max-width:380px){ .icon{width:60px;height:60px;} .label{font-size:.75rem;} }
</style>
</head>
<body>

  <div class="card">

    <div class="apps">
      <!-- 機械製造：齒輪 -->

            <path d="M8 6v50h50"/>

          </svg>

    <p class="status">✔ 網站架設測試成功 — 建置中，敬請期待</p>

<script>
/* Edu 下沉 → Dy 上升（欠阻尼彈簧落定）→ Dy 下沉 → Edu 上升 …循環 */
(function(){
  var box=document.getElementById('swap'), words=[document.getElementById('wEdu'),document.getElementById('wDy')];
  var OFF=1.35;                       // 移出視窗的距離 (em)
  var HOLD=2200, SINK=420, RISE=1500; // 停留、下沉、上升時間 (ms)
  var widths=[0,0], cur=0;
  function measure(){ widths=words.map(function(w){return w.getBoundingClientRect().width+parseFloat(getComputedStyle(box).fontSize)*.05;}); }
  function setY(el,em){ el.style.transform='translateY('+em+'em)'; }
  // 欠阻尼二階系統的步階響應：x(t)=1-e^(-ζωt)[cos(ωd t)+(ζω/ωd)sin(ωd t)]
  function spring(t){ var z=.4,w=12,wd=w*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t)); }
  function tween(ms,fn){ return new Promise(function(res){ var t0=performance.now();
    (function f(now){ var p=Math.min((now-t0)/ms,1); fn(p,(now-t0)/1000); p<1?requestAnimationFrame(f):res(); })(t0); }); }
  function wait(ms){ return new Promise(function(r){setTimeout(r,ms);}); }

  function init(){
    measure(); box.style.width=widths[0]+'px';
    setY(words[0],0); setY(words[1],OFF);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    loop();
  }
  async function loop(){
    for(;;){
      await wait(HOLD);
      var a=words[cur], b=words[1-cur], wa=widths[cur], wb=widths[1-cur];
      // 1) 現有字受重力加速下沉
      await tween(SINK,function(p){ setY(a,OFF*p*p); });
      // 2) 另一字由下方上升，過衝後衰減振盪落定；視窗寬度同步變化
      await tween(RISE,function(p,t){ var x=spring(t);
        setY(b,OFF*(1-x)); box.style.width=(wa+(wb-wa)*Math.min(x,1.08))+'px'; });
      setY(b,0); box.style.width=wb+'px';
      cur=1-cur;
    }
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);
})();
</script>
