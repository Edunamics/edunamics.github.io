<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="ch02-fig06-title ch02-fig06-desc"><title id="ch02-fig06-title">定滑輪與動滑輪的相依運動</title><desc id="ch02-fig06-desc">定滑輪與動滑輪的相依運動。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch02-fig06-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig06-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig06-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig06-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig06-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig06-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig06-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch02-fig06-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
