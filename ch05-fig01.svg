<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="ch05-fig01-title ch05-fig01-desc"><title id="ch05-fig01-title">正向碰撞前後的速度與碰撞線</title><desc id="ch05-fig01-desc">正向碰撞前後的速度與碰撞線。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch05-fig01-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch05-fig01-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch05-fig01-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch05-fig01-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch05-fig01-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch05-fig01-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch05-fig01-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch05-fig01-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><text x="165" y="44" class="" text-anchor="middle">碰撞前</text><circle cx="100" cy="190" r="40" class="body"/><circle cx="205" cy="190" r="40" class="body"/><text x="100" y="197" class="" text-anchor="middle">A</text><text x="205" y="197" class="" text-anchor="middle">B</text><line x1="40" y1="190" x2="277" y2="190" class="geo" marker-end="url(#ch05-fig01-geo)"/><text x="282" y="197" class="" text-anchor="start">n</text><line x1="153" y1="268" x2="153" y2="107" class="geo" marker-end="url(#ch05-fig01-geo)"/><text x="145" y="94" class="" text-anchor="start">t</text><line x1="100" y1="134" x2="172" y2="134" class="velocity" marker-end="url(#ch05-fig01-velocity)"/><line x1="205" y1="250" x2="163" y2="250" class="motion" marker-end="url(#ch05-fig01-motion)"/><text x="96" y="114" class="velocity-label" text-anchor="start">vA</text><text x="205" y="283" class="motion-label" text-anchor="start">vB</text><text x="475" y="44" class="" text-anchor="middle">碰撞後</text><circle cx="410" cy="190" r="40" class="body"/><circle cx="515" cy="190" r="40" class="body"/><text x="410" y="197" class="" text-anchor="middle">A</text><text x="515" y="197" class="" text-anchor="middle">B</text><line x1="350" y1="190" x2="587" y2="190" class="geo" marker-end="url(#ch05-fig01-geo)"/><text x="592" y="197" class="" text-anchor="start">n</text><line x1="463" y1="268" x2="463" y2="107" class="geo" marker-end="url(#ch05-fig01-geo)"/><text x="455" y="94" class="" text-anchor="start">t</text><line x1="410" y1="134" x2="368" y2="134" class="velocity" marker-end="url(#ch05-fig01-velocity)"/><line x1="515" y1="250" x2="587" y2="250" class="motion" marker-end="url(#ch05-fig01-motion)"/><text x="406" y="114" class="velocity-label" text-anchor="start">vA′</text><text x="515" y="283" class="motion-label" text-anchor="start">vB′</text><text x="320.0" y="337" class="eq" text-anchor="middle">mAvA + mBvB = mAvA′ + mBvB′</text></svg>
