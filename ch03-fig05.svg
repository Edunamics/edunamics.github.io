<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="ch03-fig05-title ch03-fig05-desc"><title id="ch03-fig05-title">圓錐擺的張力、重力與運動半徑</title><desc id="ch03-fig05-desc">圓錐擺的張力、重力與運動半徑。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch03-fig05-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig05-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig05-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig05-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig05-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig05-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig05-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch03-fig05-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><circle cx="279" cy="65" r="4" class="dot"/><text x="255" y="49" class="" text-anchor="start">O</text><line x1="279" y1="65" x2="279" y2="325" class="guide"/><line x1="279" y1="65" x2="427" y2="325" class="geo"/><ellipse cx="279" cy="325" rx="148" ry="44" class="guide"/><circle cx="427" cy="325" r="4" class="dot"/><text x="437" y="313" class="" text-anchor="start">P</text><line x1="279" y1="325" x2="427" y2="325" class="guide"/><text x="337" y="348" class="" text-anchor="start">r</text><text x="365" y="193" class="" text-anchor="start">L</text><path d="M 279 126 A 61 61 0 0 1 311 117" class="geo"/><text x="292" y="150" class="" text-anchor="start">θ</text><line x1="427" y1="325" x2="365" y2="215" class="force" marker-end="url(#ch03-fig05-force)"/><text x="368" y="247" class="force-label" text-anchor="start">T</text><line x1="427" y1="325" x2="427" y2="403" class="force" marker-end="url(#ch03-fig05-force)"/><text x="444" y="395" class="force-label" text-anchor="start">mg</text><line x1="427" y1="325" x2="332" y2="325" class="motion" marker-end="url(#ch03-fig05-motion)"/><text x="339" y="301" class="motion-label" text-anchor="start">mv²/r</text><text x="320.0" y="454" class="eq" text-anchor="middle">r = L sin θ　　T cos θ = mg</text></svg>
