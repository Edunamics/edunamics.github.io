<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="ch03-fig02-title ch03-fig02-desc"><title id="ch03-fig02-title">切線與法線座標下的運動方程式</title><desc id="ch03-fig02-desc">切線與法線座標下的運動方程式。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch03-fig02-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig02-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig02-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig02-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig02-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig02-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig02-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch03-fig02-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><path d="M 55 244 Q 176 36 280 240" class="guide"/><circle cx="181" cy="133" r="4" class="dot"/><text x="153" y="133" class="" text-anchor="start">P</text><line x1="181" y1="133" x2="262" y2="170" class="velocity" marker-end="url(#ch03-fig02-velocity)"/><line x1="181" y1="133" x2="142" y2="225" class="motion" marker-end="url(#ch03-fig02-motion)"/><text x="262" y="154" class="velocity-label" text-anchor="start">t</text><text x="122" y="244" class="motion-label" text-anchor="start">n</text><text x="306" y="196" class="eq" text-anchor="middle" style="font-size:36px">=</text><circle cx="445" cy="180" r="4" class="dot"/><text x="455" y="168" class="" text-anchor="start">P</text><line x1="445" y1="180" x2="529" y2="219" class="force" marker-end="url(#ch03-fig02-force)"/><line x1="445" y1="180" x2="406" y2="272" class="motion" marker-end="url(#ch03-fig02-motion)"/><text x="531" y="210" class="force-label" text-anchor="start">maₜ</text><text x="354" y="295" class="motion-label" text-anchor="start">maₙ</text><text x="320.0" y="375" class="eq" text-anchor="middle">ΣFₜ = m dv/dt　　ΣFₙ = mv²/ρ</text></svg>
