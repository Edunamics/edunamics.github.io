<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" role="img" aria-labelledby="ch07-fig03-title ch07-fig03-desc"><title id="ch07-fig03-title">矩形板、薄圓板、圓柱與圓環的質量慣性矩</title><desc id="ch07-fig03-desc">矩形板、薄圓板、圓柱與圓環的質量慣性矩。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch07-fig03-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch07-fig03-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch07-fig03-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch07-fig03-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch07-fig03-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch07-fig03-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch07-fig03-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch07-fig03-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><rect x="25" y="16" width="590" height="185" rx="8" class="panel"/><text x="47" y="49" class="" text-anchor="start">矩形薄板</text><rect x="107" y="78" width="136" height="80" rx="3" class="body"/><line x1="107" y1="171" x2="243" y2="171" class="guide"/><text x="175" y="193" class="" text-anchor="middle">a</text><text x="89" y="126" class="" text-anchor="start">b</text><line x1="175" y1="118" x2="267" y2="118" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="275" y="125" class="" text-anchor="start">x</text><line x1="175" y1="118" x2="175" y2="50" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="187" y="51" class="" text-anchor="start">y</text><circle cx="175" cy="118" r="8" class="geo"/><circle cx="175" cy="118" r="2" class="dot"/><text x="150" y="105" class="" text-anchor="start">z</text><text x="323" y="97" class="eq" text-anchor="start" style="font-size:22px">Ix = mb²/12</text><text x="323" y="131" class="eq" text-anchor="start" style="font-size:22px">Iy = ma²/12</text><text x="323" y="165" class="eq" text-anchor="start" style="font-size:22px">Iz = m(a² + b²)/12</text><rect x="25" y="218" width="590" height="185" rx="8" class="panel"/><text x="47" y="251" class="" text-anchor="start">均質薄圓板</text><ellipse cx="175" cy="320" rx="62" ry="39" class="body"/><line x1="175" y1="320" x2="232" y2="320" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="200" y="307" class="" text-anchor="start">R</text><line x1="175" y1="320" x2="175" y2="252" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="187" y="255" class="" text-anchor="start">z</text><text x="323" y="299" class="eq" text-anchor="start" style="font-size:22px">Iz = ½mR²</text><rect x="25" y="420" width="590" height="185" rx="8" class="panel"/><text x="47" y="453" class="" text-anchor="start">均質實心圓柱</text><rect x="125" y="501" width="100" height="72" rx="3" class="body"/><ellipse cx="175" cy="573" rx="50" ry="17" class="body"/><ellipse cx="175" cy="501" rx="50" ry="17" class="body"/><line x1="175" y1="501" x2="223" y2="501" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="190" y="491" class="" text-anchor="start">R</text><line x1="175" y1="573" x2="175" y2="468" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="235" y="472" class="" text-anchor="start">z</text><text x="323" y="501" class="eq" text-anchor="start" style="font-size:22px">Iz = ½mR²</text><rect x="25" y="622" width="590" height="185" rx="8" class="panel"/><text x="47" y="655" class="" text-anchor="start">薄圓環</text><circle cx="175" cy="724" r="53" class="body"/><circle cx="175" cy="724" r="43" class="geo"/><line x1="175" y1="724" x2="226" y2="724" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="199" y="713" class="" text-anchor="start">R</text><line x1="175" y1="724" x2="175" y2="655" class="geo" marker-end="url(#ch07-fig03-geo)"/><text x="186" y="659" class="" text-anchor="start">z</text><text x="323" y="703" class="eq" text-anchor="start" style="font-size:22px">Iz = mR²</text><text x="320" y="850" class="small" text-anchor="middle">軸線通過質心；z 垂直於板面／沿圓柱軸</text></svg>
