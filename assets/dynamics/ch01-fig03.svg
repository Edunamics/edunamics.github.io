<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" width="640" height="485" role="img" aria-labelledby="ch01-fig03-title ch01-fig03-desc"><title id="ch01-fig03-title">等速度運動的 x–t、v–t 與 a–t 圖</title><desc id="ch01-fig03-desc">等速度運動的 x–t、v–t 與 a–t 圖。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch01-fig03-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch01-fig03-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch01-fig03-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch01-fig03-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch01-fig03-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch01-fig03-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch01-fig03-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch01-fig03-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#152231;--sub:#566677;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
