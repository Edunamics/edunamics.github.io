<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="ch01-fig02-title ch01-fig02-desc"><title id="ch01-fig02-title">直線運動的位置與位移</title><desc id="ch01-fig02-desc">直線運動的位置與位移。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch01-fig02-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch01-fig02-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch01-fig02-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch01-fig02-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch01-fig02-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch01-fig02-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch01-fig02-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch01-fig02-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#152231;--sub:#566677;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><line x1="55" y1="160" x2="590" y2="160" class="geo" marker-end="url(#ch01-fig02-geo)"/><text x="600" y="166" class="" text-anchor="start">x</text><circle cx="90" cy="160" r="4" class="dot"/><text x="100" y="196" class="" text-anchor="start">O</text><circle cx="235" cy="160" r="4" class="dot"/><text x="207" y="196" class="" text-anchor="start">x(t)</text><circle cx="485" cy="160" r="4" class="dot"/><text x="423" y="196" class="" text-anchor="start">x(t + Δt)</text><line x1="235" y1="92" x2="485" y2="92" class="motion" marker-end="url(#ch01-fig02-motion)"/><line x1="235" y1="82" x2="235" y2="165" class="guide"/><line x1="485" y1="82" x2="485" y2="165" class="guide"/><text x="350" y="72" class="motion-label" text-anchor="middle">Δx</text><text x="320.0" y="235" class="eq" text-anchor="middle">Δx = x(t + Δt) − x(t)</text></svg>
