<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="ch02-fig03-title ch02-fig03-desc"><title id="ch02-fig03-title">斜向拋體的速度分量、最大高度與射程</title><desc id="ch02-fig03-desc">斜向拋體的速度分量、最大高度與射程。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch02-fig03-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig03-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch02-fig03-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig03-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch02-fig03-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig03-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch02-fig03-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch02-fig03-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#152231;--sub:#566677;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><line x1="75" y1="310" x2="565" y2="310" class="geo" marker-end="url(#ch02-fig03-geo)"/><line x1="75" y1="310" x2="75" y2="55" class="geo" marker-end="url(#ch02-fig03-geo)"/><text x="573" y="317" class="" text-anchor="start">x</text><text x="65" y="43" class="" text-anchor="start">y</text><path d="M 75 310 Q 315 -95 555 310" class="motion"/><circle cx="75" cy="310" r="4" class="dot"/><text x="49" y="332" class="" text-anchor="start">O</text><line x1="75" y1="310" x2="170" y2="169" class="velocity" marker-end="url(#ch02-fig03-velocity)"/><line x1="75" y1="310" x2="170" y2="310" class="geo" marker-end="url(#ch02-fig03-geo)"/><line x1="170" y1="310" x2="170" y2="169" class="guide"/><text x="150" y="167" class="velocity-label" text-anchor="start">v₀</text><text x="118" y="343" class="small" text-anchor="start">v₀ cos θ</text><text x="179" y="253" class="small" text-anchor="start">v₀ sin θ</text><path d="M 122 310 A 47 47 0 0 0 101 271" class="geo"/><text x="132" y="288" class="" text-anchor="start">θ</text><circle cx="315" cy="108" r="4" class="dot"/><line x1="315" y1="108" x2="412" y2="108" class="velocity" marker-end="url(#ch02-fig03-velocity)"/><text x="319" y="86" class="small" text-anchor="start">vᵧ = 0</text><line x1="315" y1="108" x2="315" y2="310" class="guide"/><text x="327" y="235" class="motion-label" text-anchor="start">H</text><line x1="75" y1="368" x2="555" y2="368" class="geo" marker-end="url(#ch02-fig03-geo)" marker-start="url(#ch02-fig03-geo-start)"/><text x="315" y="357" class="" text-anchor="middle">R</text><line x1="528" y1="105" x2="528" y2="184" class="force" marker-end="url(#ch02-fig03-force)"/><text x="545" y="151" class="force-label" text-anchor="start">g</text><text x="320.0" y="416" class="eq" text-anchor="middle">R = v₀² sin(2θ) / g（落點與起點同高）</text></svg>
