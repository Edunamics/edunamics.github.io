<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="ch05-fig03-title ch05-fig03-desc"><title id="ch05-fig03-title">位置向量、速度與角動量的幾何關係</title><desc id="ch05-fig03-desc">位置向量、速度與角動量的幾何關係。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch05-fig03-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch05-fig03-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch05-fig03-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch05-fig03-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch05-fig03-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch05-fig03-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch05-fig03-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch05-fig03-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#16261C;--sub:#56685C;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><line x1="210" y1="270" x2="535" y2="270" class="geo" marker-end="url(#ch05-fig03-geo)"/><line x1="210" y1="270" x2="210" y2="78" class="geo" marker-end="url(#ch05-fig03-geo)"/><text x="543" y="277" class="" text-anchor="start">x</text><text x="200" y="66" class="" text-anchor="start">y</text><line x1="210" y1="270" x2="87" y2="335" class="geo" marker-end="url(#ch05-fig03-geo)"/><text x="75" y="356" class="" text-anchor="start">z</text><circle cx="210" cy="270" r="4" class="dot"/><text x="218" y="298" class="" text-anchor="start">O</text><line x1="210" y1="270" x2="399" y2="146" class="motion" marker-end="url(#ch05-fig03-motion)"/><circle cx="399" cy="146" r="4" class="dot"/><text x="409" y="134" class="" text-anchor="start">P</text><line x1="399" y1="146" x2="448" y2="58" class="velocity" marker-end="url(#ch05-fig03-velocity)"/><line x1="210" y1="270" x2="115" y2="320" class="force" marker-end="url(#ch05-fig03-force)"/><text x="311" y="221" class="motion-label" text-anchor="start">r</text><text x="459" y="65" class="velocity-label" text-anchor="start">mv</text><text x="75" y="302" class="force-label" text-anchor="start">HO</text><text x="320.0" y="375" class="eq" text-anchor="middle">HO = r × mv（垂直於 r 與 v 的平面）</text></svg>
