<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="ch06-fig03-title ch06-fig03-desc"><title id="ch06-fig03-title">定軸轉動的速度、切線與法線加速度</title><desc id="ch06-fig03-desc">定軸轉動的速度、切線與法線加速度。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch06-fig03-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch06-fig03-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch06-fig03-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch06-fig03-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch06-fig03-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch06-fig03-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch06-fig03-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch06-fig03-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#152231;--sub:#566677;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><circle cx="191" cy="228" r="84" class="body"/><circle cx="191" cy="228" r="4" class="dot"/><text x="166" y="253" class="" text-anchor="start">G</text><circle cx="268" cy="196" r="4" class="dot"/><text x="278" y="184" class="" text-anchor="start">P</text><line x1="191" y1="228" x2="268" y2="196" class="geo" marker-end="url(#ch06-fig03-geo)"/><text x="219" y="244" class="" text-anchor="start">r</text><line x1="268" y1="196" x2="236" y2="119" class="velocity" marker-end="url(#ch06-fig03-velocity)"/><text x="211" y="106" class="velocity-label" text-anchor="start">v</text><text x="184" y="56" class="small" text-anchor="middle">速度</text><circle cx="461" cy="228" r="84" class="body"/><circle cx="461" cy="228" r="4" class="dot"/><text x="436" y="253" class="" text-anchor="start">G</text><circle cx="538" cy="196" r="4" class="dot"/><text x="548" y="184" class="" text-anchor="start">P</text><line x1="538" y1="196" x2="461" y2="228" class="motion" marker-end="url(#ch06-fig03-motion)"/><line x1="538" y1="196" x2="506" y2="119" class="force" marker-end="url(#ch06-fig03-force)"/><text x="519" y="106" class="force-label" text-anchor="start">aₜ</text><text x="476" y="267" class="motion-label" text-anchor="start">aₙ</text><text x="461" y="56" class="small" text-anchor="middle">加速度</text><text x="320.0" y="406" class="eq" text-anchor="middle">v = ω × r　　a = α × r − ω²r</text></svg>
