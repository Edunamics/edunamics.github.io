<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="ch03-fig01-title ch03-fig01-desc"><title id="ch03-fig01-title">直角座標下的受力圖與加速度圖</title><desc id="ch03-fig01-desc">直角座標下的受力圖與加速度圖。依講義概念重新繪製；幾何形狀為示意，不代表實際比例。</desc><defs><marker id="ch03-fig01-geo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig01-geo-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--fg)"/></marker><marker id="ch03-fig01-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig01-motion-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--motion)"/></marker><marker id="ch03-fig01-velocity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig01-velocity-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--velocity)"/></marker><marker id="ch03-fig01-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker><marker id="ch03-fig01-force-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="var(--force)"/></marker></defs><style>
svg{--fg:#152231;--sub:#566677;--line:#b2c4bd;--paper:#fff;--soft:#e1f0e8;--motion:#0f6b3a;--velocity:#2563a6;--force:#c2410c;color:var(--fg);background:var(--paper)}
@media(prefers-color-scheme:dark){svg{--fg:#e5edf6;--sub:#adbecb;--line:#526d60;--paper:#13211a;--soft:#1a3426;--motion:#5fc696;--velocity:#80b8f2;--force:#ff9a73}}
text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:var(--fg)}
.small{font-size:18px;fill:var(--sub)}.eq{font-size:24px;fill:var(--motion)}
.geo{stroke:var(--fg);stroke-width:2;fill:none}.guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;fill:none}
.body{fill:var(--soft);stroke:var(--motion);stroke-width:2}.ghost{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.force{stroke:var(--force);fill:none;stroke-width:3}.velocity{stroke:var(--velocity);fill:none;stroke-width:3}.motion{stroke:var(--motion);fill:none;stroke-width:3}
.force-label{fill:var(--force)}.velocity-label{fill:var(--velocity)}.motion-label{fill:var(--motion)}
.dot{fill:var(--fg)}.area{fill:var(--soft);stroke:none}.panel{fill:none;stroke:var(--line);stroke-width:1.3}
</style><text x="32" y="34" class="small" text-anchor="start">受力圖</text><line x1="125" y1="232" x2="245" y2="232" class="geo" marker-end="url(#ch03-fig01-geo)"/><line x1="125" y1="232" x2="125" y2="112" class="geo" marker-end="url(#ch03-fig01-geo)"/><text x="253" y="239" class="" text-anchor="start">x</text><text x="115" y="100" class="" text-anchor="start">y</text><line x1="125" y1="232" x2="180" y2="142" class="force" marker-end="url(#ch03-fig01-force)"/><line x1="125" y1="232" x2="57" y2="167" class="force" marker-end="url(#ch03-fig01-force)"/><line x1="125" y1="232" x2="137" y2="310" class="force" marker-end="url(#ch03-fig01-force)"/><circle cx="125" cy="232" r="4" class="dot"/><text x="135" y="220" class="" text-anchor="start">P</text><text x="185" y="142" class="force-label" text-anchor="start">F₁</text><text x="35" y="154" class="force-label" text-anchor="start">F₂</text><text x="145" y="315" class="force-label" text-anchor="start">F₃</text><text x="305" y="224" class="eq" text-anchor="middle" style="font-size:36px">=</text><text x="400" y="34" class="small" text-anchor="start">運動圖</text><line x1="430" y1="232" x2="555" y2="232" class="geo" marker-end="url(#ch03-fig01-geo)"/><line x1="430" y1="232" x2="430" y2="112" class="geo" marker-end="url(#ch03-fig01-geo)"/><text x="563" y="239" class="" text-anchor="start">x</text><text x="420" y="100" class="" text-anchor="start">y</text><circle cx="430" cy="232" r="4" class="dot"/><text x="440" y="220" class="" text-anchor="start">P</text><line x1="430" y1="232" x2="429" y2="155" class="motion" marker-end="url(#ch03-fig01-motion)"/><text x="451" y="155" class="motion-label" text-anchor="start">ma</text><text x="320.0" y="385" class="eq" text-anchor="middle">ΣFₓ = maₓ　　ΣFᵧ = maᵧ</text></svg>
